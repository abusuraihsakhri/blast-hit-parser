version: '3.8'

services:
  blast-hit-parser:
    build: .
    container_name: blast-hit-parser
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=blast-hit-parser-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
